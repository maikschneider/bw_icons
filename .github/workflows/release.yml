name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate tag
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$ ]]; then
            echo "Tag must use semantic version format, for example 5.0.0"
            exit 1
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --generate-notes \
              --title "$GITHUB_REF_NAME"
          fi

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: intl, mbstring, json, zip, curl
          tools: composer:v2, typo3/tailor

      - name: Publish to TER
        env:
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}
          TYPO3_API_TOKEN: ${{ secrets.TYPO3_API_TOKEN }}
          TYPO3_EXCLUDE_FROM_PACKAGING: packaging_exclude.php
          TYPO3_EXTENSION_KEY: bw_icons
        run: |
          php ~/.composer/vendor/bin/tailor set-version "$GITHUB_REF_NAME"
          php ~/.composer/vendor/bin/tailor ter:publish \
            --comment "See release notes at $RELEASE_URL" \
            "$GITHUB_REF_NAME"
