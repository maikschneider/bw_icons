name: Tests

on:
  push:
    branches:
      - main
      - 'renovate/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit (PHP ${{ matrix.php-version }}, TYPO3 ${{ matrix.typo3-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        typo3-version: [ "13.4", "14.3" ]
        php-version: [ "8.2", "8.3", "8.4", "8.5" ]

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
          extensions: mbstring, xml, ctype, iconv, intl

      - name: Install Composer dependencies
        uses: ramsey/composer-install@4.0.0
        with:
          composer-options: --with=typo3/cms-core:"^${{ matrix.typo3-version }}"

      - name: Show TYPO3 version
        run: composer show typo3/cms-core | grep '^versions'

      - name: Run unit tests
        run: composer ci:test:unit

  acceptance-tests:
    name: Acceptance (PHP ${{ matrix.php-version }}, TYPO3 ${{ matrix.typo3-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        typo3-version: [ "13.4", "14.3" ]
        php-version: [ "8.2", "8.5" ]

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Prepare environment
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, mysql

      # Setup DDEV
      - name: Setup DDEV
        uses: ddev/github-action-setup-ddev@v1
        with:
          autostart: false
      - name: Configure and start DDEV
        run: |
          ddev config --project-type=typo3 --php-version=${{ matrix.php-version }}
          ddev start

      # Install dependencies
      - name: Install Composer dependencies
        uses: ramsey/composer-install@4.0.0
        with:
          composer-options: --with=typo3/cms-core:"^${{ matrix.typo3-version }}"

      - name: Show TYPO3 version
        run: composer show typo3/cms-core | grep '^versions'

      # Init TYPO3
      - name: Init TYPO3
        run: ddev init-typo3

      - name: Run acceptance tests
        uses: nick-fields/retry@v4
        with:
          max_attempts: 3
          retry_on: any
          timeout_minutes: 20
          command: ddev playwright test --config=playwright.config.ts

      # Save acceptance reports
      - uses: actions/upload-artifact@v7
        with:
          name: playwright-reports-${{ matrix.php-version }}-${{ matrix.typo3-version }}
          path: |
            Tests/Playwright/test-results
            Tests/Playwright/playwright-report
        if: failure()

  coverage:
    name: Coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          php-version: "8.4"
          coverage: pcov
          extensions: mbstring, xml, ctype, iconv, intl

      - name: Install Composer dependencies
        uses: ramsey/composer-install@4.0.0
        with:
          composer-options: --with=typo3/cms-core:"^14.3"

      - name: Run unit tests with coverage
        run: vendor/bin/phpunit --testsuite Unit --coverage-clover coverage.unit.xml

      - name: Upload unit coverage to Codecov
        uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.unit.xml
          flags: unit
          disable_search: true
          fail_ci_if_error: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
