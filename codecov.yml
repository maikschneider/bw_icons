codecov:
  require_ci_to_pass: true

coverage:
  status:
    project:
      default:
        target: auto
        threshold: 2%
        informational: true
    patch:
      default:
        target: 80%
        threshold: 5%
        informational: true

flags:
  unit:
    paths:
      - Classes/
    carryforward: true

ignore:
  - Tests/
  - vendor/
  - Resources/
  - Configuration/
  - config/
  - .ddev/
  - public/
  - ext_emconf.php

comment:
  layout: "reach,diff,flags,files"
  behavior: default
  require_changes: true

github_checks:
  annotations: true
